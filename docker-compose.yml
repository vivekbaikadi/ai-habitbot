services:
  postgres:
    image: postgres:16
    container_name: ai-habitbot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habitbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:-habitbot}

    ports:
      - "5432:5432"

    volumes:
      - habitbot_postgres_data:/var/lib/postgresql/data

volumes:
  habitbot_postgres_data: